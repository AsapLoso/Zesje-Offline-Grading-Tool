<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zesje Offline Grader</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        :root {
            --bg-color: #0f172a;
            --surface-color: rgba(30, 41, 59, 0.85);
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --accent: #8b5cf6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --glass-border: rgba(255, 255, 255, 0.1);
            --danger: #ef4444;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top right, #1e1b4b, var(--bg-color));
            color: var(--text-main);
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            overscroll-behavior: none;
        }

        header {
            background: var(--surface-color);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--glass-border);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }

        .title-group h1 {
            font-size: 1.2rem;
            font-weight: 700;
            background: linear-gradient(to right, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .title-group p {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        button {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 8px;
            font-family: inherit;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        button:active {
            transform: scale(0.95);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border: none;
        }

        .btn-success {
            background: var(--success);
            border: none;
        }

        /* Problem Tabs */
        .tabs {
            display: flex;
            background: rgba(15, 23, 42, 0.9);
            padding: 8px 16px;
            gap: 8px;
            z-index: 90;
            border-bottom: 1px solid var(--glass-border);
        }
        
        .tab-btn {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
            font-weight: 600;
            text-align: center;
            font-size: 0.95rem;
        }
        
        .tab-btn.active {
            background: var(--primary);
            color: #fff;
            border-color: #60a5fa;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.4);
        }

        main {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: #000;
            touch-action: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #image-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            transform-origin: 0 0;
            will-change: transform;
        }

        #scanned-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            pointer-events: none;
        }

        .empty-state {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: var(--text-muted);
            padding: 20px;
        }

        .empty-state svg {
            width: 48px;
            height: 48px;
            margin-bottom: 12px;
            opacity: 0.5;
        }

        footer {
            background: var(--surface-color);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-top: 1px solid var(--glass-border);
            padding: 12px 16px;
            padding-bottom: env(safe-area-inset-bottom, 16px);
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 100;
        }

        .info-bar {
            display: flex;
            justify-content: space-between;
            font-size: 0.95rem;
            color: #cbd5e1;
        }

        .filename { font-weight: 700; color: #fff; }
        
        .rubric-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow-y: auto;
            max-height: 250px;
        }

        .rubric-toggle {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            padding: 10px 12px;
            border-radius: 8px;
            gap: 12px;
            text-align: left;
            margin: 0;
        }

        .pts-badge {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid #60a5fa;
            color: #60a5fa;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            font-weight: 700;
            flex-shrink: 0;
        }

        .rubric-text {
            font-size: 0.9rem;
            line-height: 1.2;
            flex: 1;
        }

        .rubric-toggle.selected {
            background: rgba(59, 130, 246, 0.25);
            border-color: var(--primary);
        }
        
        .rubric-toggle.selected .pts-badge {
            background: var(--primary);
            border-color: var(--primary);
            color: #fff;
        }

        .nav-controls {
            display: flex;
            gap: 12px;
        }

        .nav-controls button {
            flex: 1;
            padding: 14px;
            font-size: 1.05rem;
        }

        #file-input { display: none; }
        
        .toast {
            position: fixed;
            top: 130px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: rgba(16, 185, 129, 0.95);
            backdrop-filter: blur(8px);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 0.95rem;
            font-weight: 600;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 1000;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }
        
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <header>
        <div class="title-group">
            <h1>Zesje Grader</h1>
            <p id="progress-text">No folder loaded</p>
        </div>
        <div style="display: flex; gap: 8px;">
            <button id="load-btn" class="btn-primary">Load Folder</button>
            <button id="import-btn" class="btn-primary" style="display: none;">Import CSV</button>
            <button id="export-btn" class="btn-success" style="display: none;">Export CSV</button>
        </div>
        <input type="file" id="file-input" webkitdirectory directory multiple />
        <input type="file" id="csv-input" accept=".csv" style="display: none;" />
    </header>

    <div id="problem-tabs" class="tabs" style="display: none;">
        <!-- Tabs injected by JS -->
    </div>

    <main id="main-area">
        <div id="image-container">
            <img id="scanned-image" src="" style="display: none;" />
        </div>
        <div id="empty-state" class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                <circle cx="8.5" cy="8.5" r="1.5"></circle>
                <polyline points="21 15 16 10 5 21"></polyline>
            </svg>
            <p>Tap "Load Folder" to select your <strong>zesje_images</strong> directory.</p>
        </div>
    </main>

    <footer>
        <div class="info-bar">
            <span id="current-filename" class="filename">---</span>
            <span id="current-score">Unscored</span>
        </div>
        
        <div class="rubric-list">
            <button class="rubric-toggle" data-id="LHS_RHS" data-score="1">
                <span class="pts-badge">1</span>
                <span class="rubric-text">calculate LHS and RHS to demonstrate solution</span>
            </button>
            <button class="rubric-toggle" data-id="tau" data-score="1">
                <span class="pts-badge">1</span>
                <span class="rubric-text">determine tau</span>
            </button>
            <button class="rubric-toggle" data-id="I_0" data-score="1">
                <span class="pts-badge">1</span>
                <span class="rubric-text">determine I_0</span>
            </button>
            <button class="rubric-toggle" data-id="I_1" data-score="1">
                <span class="pts-badge">1</span>
                <span class="rubric-text">find I_1</span>
            </button>
            <button class="rubric-toggle" data-id="Blank" data-score="0">
                <span class="pts-badge">0</span>
                <span class="rubric-text">Blank</span>
            </button>
        </div>

        <div class="nav-controls">
            <button id="prev-btn">◀ Prev Student</button>
            <button id="next-btn" class="btn-primary">Next Student ▶</button>
        </div>
    </footer>

    <div id="toast" class="toast">Score Saved!</div>

    <script>
        // --- State ---
        let groupedFiles = {}; // { "submissionID": { "problemID": File } }
        let submissionIds = [];
        let currentSubIndex = 0;
        let currentProblem = null;
        let availableProblems = new Set();
        
        let grades = JSON.parse(localStorage.getItem('zesje_grades')) || {}; 
        // format: { filepath: { problem, submission, filename, score: 0, selections: [] } }

        // --- DOM Elements ---
        const fileInput = document.getElementById('file-input');
        const csvInput = document.getElementById('csv-input');
        const loadBtn = document.getElementById('load-btn');
        const importBtn = document.getElementById('import-btn');
        const exportBtn = document.getElementById('export-btn');
        const progressText = document.getElementById('progress-text');
        const imgElement = document.getElementById('scanned-image');
        const emptyState = document.getElementById('empty-state');
        const filenameDisplay = document.getElementById('current-filename');
        const scoreDisplay = document.getElementById('current-score');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const rubricBtns = document.querySelectorAll('.rubric-toggle');
        const toast = document.getElementById('toast');
        const tabsContainer = document.getElementById('problem-tabs');

        // --- Folder Loading ---
        loadBtn.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files).filter(f => f.type.startsWith('image/'));
            
            groupedFiles = {};
            availableProblems = new Set();

            files.forEach(f => {
                const info = parseFileData(f);
                if (!groupedFiles[info.submission]) {
                    groupedFiles[info.submission] = {};
                }
                groupedFiles[info.submission][info.problem] = f;
                availableProblems.add(info.problem);
            });

            // Sort submission IDs numerically
            submissionIds = Object.keys(groupedFiles).sort((a, b) => parseInt(a) - parseInt(b));

            if (submissionIds.length > 0) {
                currentSubIndex = 0;
                
                // Smart default: if grading 1b, default to 1b, else first available
                if (availableProblems.has("1b")) currentProblem = "1b";
                else currentProblem = Array.from(availableProblems).sort()[0];

                emptyState.style.display = 'none';
                imgElement.style.display = 'block';
                exportBtn.style.display = 'block';
                importBtn.style.display = 'block';
                tabsContainer.style.display = 'flex';
                
                renderTabs();
                loadSubmission();
            } else {
                alert("No images found in the selected folder.");
            }
        });

        function parseFileData(file) {
            const parts = file.webkitRelativePath.split('/');
            const filename = parts[parts.length - 1];
            // Problem is usually the parent directory name, e.g. "1a" or "1b"
            const problem = parts.length > 1 ? parts[parts.length - 2] : 'unknown';
            
            const subMatch = filename.match(/sub_(\d+)/i);
            const submission = subMatch ? subMatch[1] : filename.replace(/\.[^/.]+$/, "");
            
            return { filename, problem, submission };
        }

        function renderTabs() {
            tabsContainer.innerHTML = '';
            const sortedProbs = Array.from(availableProblems).sort();
            
            sortedProbs.forEach(prob => {
                const btn = document.createElement('button');
                btn.className = 'tab-btn';
                btn.textContent = prob.toUpperCase();
                btn.dataset.prob = prob;
                btn.onclick = () => {
                    currentProblem = prob;
                    loadSubmission();
                };
                tabsContainer.appendChild(btn);
            });
        }

        function loadSubmission() {
            const subId = submissionIds[currentSubIndex];
            const subFiles = groupedFiles[subId];

            // Update Tabs Status
            document.querySelectorAll('.tab-btn').forEach(btn => {
                const prob = btn.dataset.prob;
                if (subFiles[prob]) {
                    btn.style.opacity = '1';
                    btn.disabled = false;
                } else {
                    btn.style.opacity = '0.4';
                    btn.disabled = true;
                    // If current problem is missing for this sub, switch to an available one
                    if (prob === currentProblem) {
                        currentProblem = Object.keys(subFiles)[0];
                    }
                }
                
                if (prob === currentProblem) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });

            const file = subFiles[currentProblem];
            
            if (file) {
                if (imgElement.src) URL.revokeObjectURL(imgElement.src);
                imgElement.src = URL.createObjectURL(file);
                
                filenameDisplay.textContent = `Student ${subId}`;
                progressText.textContent = `Student ${currentSubIndex + 1} of ${submissionIds.length}`;

                resetZoom();

                // Load Grade for THIS specific file
                const record = grades[file.webkitRelativePath];
                updateRubricUI(record ? record.selections : []);
            }
        }

        // --- Navigation ---
        prevBtn.addEventListener('click', () => {
            if (currentSubIndex > 0) {
                currentSubIndex--;
                loadSubmission();
            }
        });

        nextBtn.addEventListener('click', () => {
            if (currentSubIndex < submissionIds.length - 1) {
                currentSubIndex++;
                loadSubmission();
            }
        });

        // --- Grading Logic ---
        rubricBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                if (submissionIds.length === 0) return;

                const subId = submissionIds[currentSubIndex];
                const file = groupedFiles[subId][currentProblem];
                if (!file) return;

                const itemId = btn.dataset.id;
                const info = parseFileData(file);

                if (!grades[file.webkitRelativePath]) {
                    grades[file.webkitRelativePath] = {
                        problem: info.problem,
                        submission: info.submission,
                        filename: info.filename,
                        score: 0,
                        selections: []
                    };
                }
                
                let record = grades[file.webkitRelativePath];
                
                if (record.selections.includes(itemId)) {
                    record.selections = record.selections.filter(id => id !== itemId);
                } else {
                    record.selections.push(itemId);
                }

                let totalScore = 0;
                record.selections.forEach(id => {
                    const toggleBtn = document.querySelector(`.rubric-toggle[data-id="${id}"]`);
                    if (toggleBtn) {
                        totalScore += parseInt(toggleBtn.dataset.score);
                    }
                });
                record.score = totalScore;

                localStorage.setItem('zesje_grades', JSON.stringify(grades));
                updateRubricUI(record.selections);
            });
        });

        function updateRubricUI(selections) {
            let totalScore = 0;
            rubricBtns.forEach(btn => {
                const itemId = btn.dataset.id;
                if (selections.includes(itemId)) {
                    btn.classList.add('selected');
                    totalScore += parseInt(btn.dataset.score);
                } else {
                    btn.classList.remove('selected');
                }
            });

            if (selections.length > 0) {
                scoreDisplay.textContent = `${totalScore} points`;
                scoreDisplay.style.color = 'var(--success)';
            } else {
                scoreDisplay.textContent = 'Unscored';
                scoreDisplay.style.color = 'var(--text-muted)';
            }
        }

        // --- Export CSV ---
        exportBtn.addEventListener('click', () => {
            if (Object.keys(grades).length === 0) {
                alert("No grades recorded yet.");
                return;
            }

            let csvContent = "data:text/csv;charset=utf-8,";
            csvContent += "Problem,Submission,Filename,TotalScore,Selections\n";

            for (const path in grades) {
                const g = grades[path];
                const selectionsStr = `"${g.selections.join(', ')}"`;
                csvContent += `${g.problem},${g.submission},${g.filename},${g.score},${selectionsStr}\n`;
            }

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "zesje_grades.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });

        // --- Import CSV ---
        importBtn.addEventListener('click', () => csvInput.click());

        csvInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(evt) {
                const text = evt.target.result;
                const lines = text.split(/\r?\n/);
                let importedCount = 0;
                
                // Skip header
                for (let i = 1; i < lines.length; i++) {
                    const line = lines[i].trim();
                    if (!line) continue;
                    
                    let result = [];
                    let current = '';
                    let inQuotes = false;
                    for (let j = 0; j < line.length; j++) {
                        let char = line[j];
                        if (char === '"') inQuotes = !inQuotes;
                        else if (char === ',' && !inQuotes) { result.push(current); current = ''; }
                        else current += char;
                    }
                    result.push(current);
                    
                    if (result.length >= 5) {
                        const problem = result[0];
                        const submission = result[1];
                        const filename = result[2];
                        const score = parseInt(result[3]);
                        const selectionsRaw = result[4] ? result[4].replace(/^"|"$/g, '') : '';
                        const selections = selectionsRaw ? selectionsRaw.split(',').map(s => s.trim()).filter(s => s) : [];
                        
                        const filepath = `${problem}/${filename}`;
                        grades[filepath] = { problem, submission, filename, score, selections };
                        importedCount++;
                    }
                }
                
                localStorage.setItem('zesje_grades', JSON.stringify(grades));
                showToast(`Imported ${importedCount} grades!`);
                if (submissionIds.length > 0) loadSubmission();
            };
            reader.readAsText(file);
            csvInput.value = ''; // Reset input so same file can be imported again if needed
        });

        // --- PINCH TO ZOOM & PAN ---
        const mainArea = document.getElementById('main-area');
        const container = document.getElementById('image-container');
        
        let state = {
            scale: 1, x: 0, y: 0, isPanning: false, startX: 0, startY: 0,
            initialDistance: 0, initialScale: 1, centerX: 0, centerY: 0
        };

        function setTransform() {
            if (state.scale < 1) { state.scale = 1; state.x = 0; state.y = 0; }
            container.style.transform = `translate(${state.x}px, ${state.y}px) scale(${state.scale})`;
        }

        function resetZoom() {
            state.scale = 1; state.x = 0; state.y = 0;
            container.style.transition = 'transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1)';
            setTransform();
            setTimeout(() => container.style.transition = 'none', 200);
        }

        function getDistance(touches) {
            return Math.hypot(
                touches[0].clientX - touches[1].clientX,
                touches[0].clientY - touches[1].clientY
            );
        }

        function getCenter(touches) {
            return {
                x: (touches[0].clientX + touches[1].clientX) / 2,
                y: (touches[0].clientY + touches[1].clientY) / 2
            };
        }

        mainArea.addEventListener('touchstart', (e) => {
            if (submissionIds.length === 0) return;
            
            if (e.touches.length === 1) {
                state.isPanning = true;
                state.startX = e.touches[0].clientX - state.x;
                state.startY = e.touches[0].clientY - state.y;
            } else if (e.touches.length === 2) {
                state.isPanning = false;
                state.initialDistance = getDistance(e.touches);
                state.initialScale = state.scale;
                
                const center = getCenter(e.touches);
                const rect = mainArea.getBoundingClientRect();
                state.centerX = center.x - rect.left;
                state.centerY = center.y - rect.top;
                container.style.transformOrigin = `${state.centerX}px ${state.centerY}px`;
            }
        }, { passive: false });

        mainArea.addEventListener('touchmove', (e) => {
            if (submissionIds.length === 0) return;
            e.preventDefault(); 
            
            if (e.touches.length === 1 && state.isPanning && state.scale > 1) {
                state.x = e.touches[0].clientX - state.startX;
                state.y = e.touches[0].clientY - state.startY;
                setTransform();
            } else if (e.touches.length === 2) {
                const currentDistance = getDistance(e.touches);
                const zoomFactor = currentDistance / state.initialDistance;
                state.scale = Math.min(Math.max(1, state.initialScale * zoomFactor), 5); 
                setTransform();
            }
        }, { passive: false });

        mainArea.addEventListener('touchend', (e) => {
            if (e.touches.length < 2) state.initialDistance = 0;
            if (e.touches.length === 0) state.isPanning = false;
        });

        let lastTap = 0;
        mainArea.addEventListener('touchend', (e) => {
            if (submissionIds.length === 0) return;
            const currentTime = new Date().getTime();
            const tapLength = currentTime - lastTap;
            
            if (tapLength < 300 && tapLength > 0 && e.changedTouches.length === 1) {
                if (state.scale > 1) {
                    resetZoom();
                } else {
                    const touch = e.changedTouches[0];
                    const rect = mainArea.getBoundingClientRect();
                    container.style.transformOrigin = `${touch.clientX - rect.left}px ${touch.clientY - rect.top}px`;
                    
                    state.scale = 2.5;
                    container.style.transition = 'transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1)';
                    setTransform();
                    setTimeout(() => container.style.transition = 'none', 200);
                }
                e.preventDefault();
            }
            lastTap = currentTime;
        });
    </script>
</body>
</html>
